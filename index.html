    // =========================================================================
    // 2. 工具函数 (Utility Functions)

    function maskOrderId(orderId) {
      if (!orderId || orderId.length < 10) return orderId;
      return `${orderId.slice(0, 5)}****${orderId.slice(-4)}`;
    }

    function formatNow() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(
        now.getHours()
      )}:${pad(now.getMinutes())}`;
    }

    function checkSensitiveContent(text) {
      if (!text) return null;
      const normalized = text.replace(/\s+/g, '');
      for (const word of SENSITIVE_KEYWORDS) {
        if (normalized.includes(word)) {
          return word;
        }
      }
      return null;
    }

    function validateOrderNumber(rawOrder) {
      const trimmed = (rawOrder || '').trim().toUpperCase();
      if (!trimmed) {
        return { ok: false, error: '请输入小红书订单号' };
      }

      const xhsOrderRegex = /^P\d{17,19}$/;
      if (!xhsOrderRegex.test(trimmed)) {
        return { ok: false, error: '订单号格式不正确', countFail: true };
      }

      let completedOrders = DEFAULT_COMPLETED_ORDERS;
      try {
        const stored = localStorage.getItem(STORAGE_KEYS.COMPLETED_ORDERS);
        if (stored) {
          completedOrders = JSON.parse(stored);
        } else {
          localStorage.setItem(
            STORAGE_KEYS.COMPLETED_ORDERS,
            JSON.stringify(DEFAULT_COMPLETED_ORDERS)
          );
        }
      } catch (err) {
        console.error(err);
      }

      if (completedOrders.includes(trimmed)) {
        return { ok: false, error: '该订单号已使用，请更换新订单号', countFail: true };
      }

      return { ok: true, normalized: trimmed };
    }

    function markOrderAsCompleted(orderId) {
      if (!orderId) return;
      try {
        const completedRaw = localStorage.getItem(STORAGE_KEYS.COMPLETED_ORDERS);
        const completedList = completedRaw
          ? JSON.parse(completedRaw)
          : [...DEFAULT_COMPLETED_ORDERS];

        if (!completedList.includes(orderId)) {
          completedList.push(orderId);
          localStorage.setItem(
            STORAGE_KEYS.COMPLETED_ORDERS,
            JSON.stringify(completedList)
          );
        }
      } catch (e) {
        console.error(e);
      }
    }

    function recordFailedAttempt() {
      try {
        const now = Date.now();
        const oneHour = 60 * 60 * 1000;
        const raw = localStorage.getItem(STORAGE_KEYS.RATE_LIMIT);
        let data = raw ? JSON.parse(raw) : { attempts: [], lockUntil: null };

        const recentAttempts = (data.attempts || []).filter((ts) => now - ts < oneHour);
        recentAttempts.push(now);

        if (recentAttempts.length >= 3) {
          const newLockUntil = now + oneHour;
          data = { attempts: recentAttempts, lockUntil: newLockUntil };
          localStorage.setItem(STORAGE_KEYS.RATE_LIMIT, JSON.stringify(data));
          return { locked: true, lockUntil: newLockUntil };
        } else {
          data = { attempts: recentAttempts, lockUntil: null };
          localStorage.setItem(STORAGE_KEYS.RATE_LIMIT, JSON.stringify(data));
          return { locked: false, lockUntil: null };
        }
      } catch {
        return { locked: false, lockUntil: null };
      }
    }

    function getActiveRateLock() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.RATE_LIMIT);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data.lockUntil && Date.now() < data.lockUntil) {
          return data.lockUntil;
        }
        if (data.lockUntil && Date.now() >= data.lockUntil) {
          localStorage.removeItem(STORAGE_KEYS.RATE_LIMIT);
        }
      } catch {}
      return null;
    }

    // =========================================================================
    // 5. 核心主页面：免登录开放式时差信箱 (Main Mailbox Workspace)
    // =========================================================================

    function MainMailboxWorkspace({ onGoSealedReceipt }) {
      const [activeTab, setActiveTab] = useState('explore'); // 'explore' | 'mine' | 'write'

      // 全站匿名纸条库（LocalStorage 持久化，永不丢失）
      const [publicNotes, setPublicNotes] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEYS.PUBLIC_NOTES);
          return saved ? JSON.parse(saved) : INITIAL_PUBLIC_NOTES;
        } catch {
          return INITIAL_PUBLIC_NOTES;
        }
      });

      // 我投递的纸条列表（LocalStorage 持久化，永不丢失）
      const [mySavedNotes, setMySavedNotes] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEYS.MY_SAVED_NOTES);
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      // 写信区表单状态
      const [orderInput, setOrderInput] = useState('');
      const [targetType, setTargetType] = useState('other'); // 'other' | 'self'
      const [recipientName, setRecipientName] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [formToast, setFormToast] = useState(null);
      const [isSending, setIsSending] = useState(false);
      const [lockUntil, setLockUntil] = useState(() => getActiveRateLock());
      const [remainingText, setRemainingText] = useState('');

      // 搜索状态
      const [searchQuery, setSearchQuery] = useState('林深');
      const [searchedName, setSearchedName] = useState('林深');

      // 弹窗状态
      const [showSafetyModal, setShowSafetyModal] = useState(false);
      const [showConfirmSeal, setShowConfirmSeal] = useState(false);

      // 实时同步所有纸条到 LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.PUBLIC_NOTES, JSON.stringify(publicNotes));
        } catch (e) {
          console.error(e);
        }
      }, [publicNotes]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.MY_SAVED_NOTES, JSON.stringify(mySavedNotes));
        } catch (e) {
          console.error(e);
        }
      }, [mySavedNotes]);

      // 失败锁定倒计时
      useEffect(() => {
        const updateTimer = () => {
          const activeLock = getActiveRateLock();
          if (activeLock) {
            setLockUntil(activeLock);
            const diffSec = Math.ceil((activeLock - Date.now()) / 1000);
            const mins = Math.floor(diffSec / 60);
            const secs = diffSec % 60;
            setRemainingText(`${mins}分${String(secs).padStart(2, '0')}秒`);
          } else {
            setLockUntil(null);
            setRemainingText('');
          }
        };

        updateTimer();
        const timer = setInterval(updateTimer, 1000);
        return () => clearInterval(timer);
      }, []);

      // 提交纸条（必须校验小红书订单号格式及是否已被使用，并严格过滤负能量违禁词）
      const handleSendNote = (e) => {
        e.preventDefault();
        setFormToast(null);

        if (lockUntil && Date.now() < lockUntil) return;

        // 1. 校验订单号
        const orderCheck = validateOrderNumber(orderInput);
        if (!orderCheck.ok) {
          if (orderCheck.countFail) {
            const res = recordFailedAttempt();
            if (res.locked) {
              setLockUntil(res.lockUntil);
              setFormToast({ type: 'error', text: '操作过于频繁，请 1 小时后再试' });
              return;
            }
          }
          setFormToast({ type: 'error', text: orderCheck.error });
          return;
        }

        const cleanContent = noteContent.trim();
        const cleanRecipient =

                            <span>正在核销并投递...</span>
                          </>
                        ) : (
                          <>
                            <Send className="w-4 h-4" />
                            <span>验证并投递纸条</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                </div>
              </section>
            )}
          </main>

          <SafetyCareModal
            isOpen={showSafetyModal}
            onClose={() => setShowSafetyModal(false)}
          />

          <ConfirmSealModal
            isOpen={showConfirmSeal}
            noteCount={mySavedNotes.length}
            onCancel={() => setShowConfirmSeal(false)}
            onConfirm={() => {
              setShowConfirmSeal(false);
              onGoSealedReceipt(mySavedNotes);
            }}
          />
        </div>
      );
    }

    // =========================================================================
    // 6. 结业纪念卡视图 (Sealed Receipt View)
    // =========================================================================

    function SealedReceiptView({ myNotes, onReturnMain }) {
      const healingQuote = useMemo(() => {
        const idx = Math.floor(Math.random() * HEALING_QUOTES.length);
        return HEALING_QUOTES[idx];
      }, []);

      const latestNote = myNotes && myNotes.length > 0 ? myNotes[0] : null;

      return (
        <div className="relative min-h-screen flex flex-col items-center justify-center px-4 py-10 overflow-hidden">
          <div className="pointer-events-none absolute top-[5%] left-[15%] w-[26rem] h-[26rem] rounded-full bg-gradient-to-tr from-[#F48C7F]/20 to-[#F7A072]/15 blur-3xl" />
          <div className="pointer-events-none absolute bottom-[5%] right-[10%] w-[24rem] h-[24rem] rounded-full bg-[#FDE2DC]/60 blur-3xl" />

          <div className="relative z-10 w-full max-w-md mb-5 animate-fade-in">
            <div className="px-4 py-3 rounded-2xl bg-gradient-to-r from-[#F48C7F] to-[#F7A072] text-white text-xs sm:text-sm font-medium shadow-warm-sm flex items-center justify-center gap-2 text-center">
              <Sparkles className="w-4 h-4 shrink-0" />
              <span>时空纪念卡已生成，请长按或截图保存您的信箱回执</span>
            </div>
          </div>

          <main className="relative z-10 w-full max-w-md animate-slide-up">
            <div className="relative bg-gradient-to-b from-[#FFFDFB] to-[#FDF6F0] border-2 border-[#FDE2DC] rounded-3xl p-7 sm:p-9 shadow-warm overflow-hidden">
              <div className="absolute -top-4 -right-4 w-28 h-28 rounded-full border-2 border-dashed border-[#F48C7F]/35 flex flex-col items-center justify-center rotate-12 pointer-events-none select-none">
                <span className="text-[9px] tracking-widest text-[#D96B5D]/70 uppercase">
                  SEALED · 回执
                </span>
                <span className="font-serif text-xs font-semibold text-[#D96B5D]/80 mt-0.5">
                  时差信箱
                </span>
                <span className="text-[8px] text-[#A3928E] mt-0.5">
                  {formatNow().split(' ')[0]}
                </span>
              </div>

              <div className="flex items-center gap-2.5 mb-6">
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-br from-[#F48C7F] to-[#F7A072] flex items-center justify-center text-white">
                  <Mail className="w-4 h-4" />
                </div>
                <div>
                  <span className="text-[10px] tracking-[0.2em] text-[#D96B5D] uppercase block">
                    TIME-LAG ARCHIVE
                  </span>
                  <h2 className="font-serif text-lg font-semibold text-[#4A3B38]">
                    时差信箱 · 专属纪念回执
                  </h2>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 p-3.5 rounded-2xl bg-white/80 border border-[#FDE2DC]/80 text-xs mb-6">
                <div>
                  <span className="text-[#A3928E] block text-[11px]">永久保存纸条数</span>
                  <span className="font-semibold text-[#4A3B38] mt-0.5 block">
                    {myNotes.length} 封
                  </span>
                </div>
                <div>
                  <span className="text-[#A3928E] block text-[11px]">封存时刻</span>
                  <span className="font-medium text-[#4A3B38] mt-0.5 block">
                    {formatNow()}
                  </span>
                </div>
              </div>

              {latestNote ? (
                <div className="mb-6">
                  <div className="flex items-center justify-between text-[11px] text-[#A3928E] mb-2">
                    <span>最近寄出心声（致：{latestNote.recipient}）</span>
                  </div>
                  <div className="p-4 rounded-2xl bg-[#FDE2DC]/35 border border-[#FDE2DC] font-serif text-sm text-[#4A3B38] leading-relaxed">
                    “{latestNote.content}”
                  </div>
                </div>
              ) : (
                <div className="mb-6 p-4 rounded-2xl bg-[#FDE2DC]/35 border border-[#FDE2DC] text-xs text-[#7A6864] leading-relaxed">
                  您在时差信箱中留下了温暖的足迹，所有美好的心意均已永久存档。
                </div>
              )}

              <div className="pt-5 border-t border-dashed border-[#F48C7F]/35">
                <p className="font-serif text-sm sm:text-base text-[#4A3B38] leading-relaxed italic">
                  {healingQuote}
                </p>
              </div>

              <div className="mt-7 flex items-center justify-between text-[11px] text-[#A3928E]">
                <span>状态：已完成封存回执</span>
                <span className="font-serif text-[#D96B5D]">—— 时差信箱敬上</span>
              </div>
            </div>

            <div className="mt-6">
              <button
                onClick={onReturnMain}
                className="w-full py-3.5 px-6 rounded-2xl bg-white/85 hover:bg-white text-[#4A3B38] border border-[#FDE2DC] font-medium text-sm shadow-warm-sm hover:shadow-warm active:scale-[0.99] transition-all flex items-center justify-center gap-2"
              >
                <RotateCcw className="w-4 h-4 text-[#E07668]" />
                <span>返回信箱主页（继续浏览或再次封存）</span>
              </button>
            </div>
          </main>
        </div>
      );
    }

    // =========================================================================
    // 7. 根组件 (App Root)
    // =========================================================================

    function App() {
      const [view, setView] = useState('main'); // 'main' | 'receipt'
      const [receiptNotes, setReceiptNotes] = useState([]);

      return (
        <>
          {view === 'main' && (
            <MainMailboxWorkspace
              onGoSealedReceipt={(notes) => {
                setReceiptNotes(notes);
                setView('receipt');
              }}
            />
          )}

          {view === 'receipt' && (
            <SealedReceiptView
              myNotes={receiptNotes}
              onReturnMain={() => setView('main')}
            />
          )}
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
